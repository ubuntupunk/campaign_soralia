[build]
  # Only site/ is published. Everything else in this repository — the email
  # log, the scripts, the function source, and the campaign/ checkout of the
  # private ops repo — is outside the deploy surface by construction.
  publish = "site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Belt and braces: these paths are already outside the publish directory.
# The redirects catch them if publish is ever widened again.
[[redirects]]
  from = "/campaign/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/emails/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/image.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
