[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Internal material is tracked in this repo but must never be served.
# Working documents, role definitions, procedures and the send log are
# version-controlled for review, not published.
[[redirects]]
  from = "/campaign/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/emails/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/image.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
