[build]
  # Only site/ is published. Everything else in this repository — the email
  # log, the scripts, the function source, and the campaign/ checkout of the
  # private ops repo — is outside the deploy surface by construction.
  publish = "site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Belt and braces: these paths are already outside the publish directory.
# The redirects catch them if publish is ever widened again.
[[redirects]]
  from = "/campaign/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/emails/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Case-numbered canonical URLs. The first order and statement were originally
# filed without a case number, and the 518015 statement used a different word
# order. Keep links in already-sent emails and other inbound links working.
[[redirects]]
  from = "/csos-order.html"
  to = "/csos-order-518005.html"
  status = 301

[[redirects]]
  from = "/csos-statement.html"
  to = "/csos-statement-518005.html"
  status = 301

[[redirects]]
  from = "/csos-518015-statement.html"
  to = "/csos-statement-518015.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/image.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
